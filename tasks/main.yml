---
# --------------------------------

- name: 'Install Python2 core packages'
  ansible.builtin.apt:
    pkg: ['python-apt', 'python-pip', 'virtualenv']
    state: present
  when:
  - ct_family == 'debian'
  - python_version_2
  become: true
  tags: ct-python

- name: 'Install Python2 tool packages'
  ansible.builtin.apt:
    pkg: ['flake8', 'pylint']
    state: present
  when:
  - ct_family == 'debian'
  - python_version_2
  become: true
  tags: ct-python

- name: 'Install Python3 core packages'
  ansible.builtin.apt:
    pkg: ['python3', 'python3-boto3', 'python3-pip', 'python3-venv']
    state: present
  when:
  - ct_family == 'debian'
  - python_version_3
  become: true
  tags: ct-python

- name: 'Install Python3 tool packages'
  ansible.builtin.apt:
    pkg: ['flake8', 'pylint3']
    state: present
  when:
  - ct_family == 'debian'
  - python_version_3
  become: true
  tags: ct-python

- name: 'Transfer bash include file for Python'
  ansible.builtin.copy:
    src: py.sh
    dest: /usr/local/etc/bash.d/
    mode: '0644'
  become: true
  tags: ct-python

- name: 'Copy ViM plugin over'
  ansible.builtin.copy:
    src: '{{ item.src }}'
    dest: '{{ item.dest }}'
    mode: '0444'
  loop:
  - {src: python.vim, dest: ~/.vim/ftplugin/python.vim}
  loop_control:
    label: '{{ item.src }}'
  tags: ct-python

