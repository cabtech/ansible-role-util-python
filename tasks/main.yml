---
# --------------------------------

- name: "Include variables wrapper"
  ansible.builtin.include_tasks:
    file: variables.yml
  tags: ["ct-python"]

- name: "Disto/Family tasks (FF)"
  ansible.builtin.include_tasks:
    file: "{{ lookup('ansible.builtin.first_found', params) }}"
  vars:
    params:
      files:
      - "{{ ansible_facts['distribution'] }}-{{ ansible_facts['distribution_major_version'].split('.')[0] }}.yml"
      - "{{ ansible_facts['distribution'] }}.yml"
      - "{{ ansible_facts['os_family'] }}.yml"
      - "default.yml"
  tags: ["ct-python"]

- name: 'Install Python2 core packages'
  ansible.builtin.apt:
    pkg: ['python-apt', 'python-pip', 'virtualenv']
    state: present
  when:
  - ansible_facts['os_family'] == 'Debian'
  - python_version_2
  become: true
  tags: ["ct-python"]

- name: 'Install Python2 tool packages'
  ansible.builtin.apt:
    pkg: ['flake8', 'pylint']
    state: present
  when:
  - ansible_facts['os_family'] == 'Debian'
  - python_version_2
  become: true
  tags: ["ct-python"]

- name: 'Install Python3 core packages'
  ansible.builtin.apt:
    pkg: ['python3', 'python3-boto3', 'python3-pip', 'python3-venv']
    state: present
  when:
  - ansible_facts['os_family'] == 'Debian'
  - python_version_3
  become: true
  tags: ["ct-python"]

- name: 'Install Python3 tool packages'
  ansible.builtin.apt:
    pkg: ['flake8', 'pylint3']
    state: present
  when:
  - ansible_facts['os_family'] == 'Debian'
  - python_version_3
  become: true
  tags: ["ct-python"]

- name: 'Transfer bash include file for Python'
  ansible.builtin.copy:
    src: py.sh
    dest: /usr/local/etc/bash.d/
    mode: '0644'
  become: true
  tags: ["ct-python"]

- name: 'Copy ViM plugin over'
  ansible.builtin.copy:
    src: '{{ item.src }}'
    dest: '{{ item.dest }}'
    mode: '0444'
  loop:
  - {src: python.vim, dest: ~/.vim/ftplugin/python.vim}
  loop_control:
    label: '{{ item.src }}'
  tags: ["ct-python"]

